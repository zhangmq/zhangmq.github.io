# 站点配置 —— zhangmq.github.io (GitHub Pages 用户主页)
# title/description 为语言中立值，供浏览器标签页、RSS、SEO meta 使用；
# 界面显示文案按语言切换，见 _data/i18n.yml
title: zhangmq
email:
description: >-
  zhangmq 的个人技术博客 / personal tech blog
baseurl: "" # 用户主页站点没有子路径
url: "https://zhangmq.github.io"
lang: zh # 站点默认语言
github_username: zhangmq

# 构建设置
theme: minima
plugins:
  - jekyll-feed

# 首页列表显示文章摘要（参考 Chirpy 布局）
show_excerpts: true

# 注：minima 2.5.1（Pages 内置版本）不支持 skin 配置；
# 深浅色模式由 assets/main.scss 的 data-theme 属性 + prefers-color-scheme 实现，
# 右上角按钮可手动切换（localStorage 记忆）。

# 双语发布：_posts/zh/ 与 _posts/en/ 分目录
# 自动注入语言字段与各自语言的永久链接
defaults:
  - scope:
      path: "_posts/zh"
    values:
      lang: zh
      permalink: /zh/:year/:month/:day/:title/
  - scope:
      path: "_posts/en"
    values:
      lang: en
      permalink: /en/:year/:month/:day/:title/
