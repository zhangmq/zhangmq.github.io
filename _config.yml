# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# 站点语言（Chirpy 内置 zh-CN 界面文案）
lang: zh-CN

# 时区
timezone: Asia/Shanghai

# jekyll-seo-tag settings
title: zhangmq's Blog # the main title
tagline: Personal tech blog # it will display as the subtitle
description: >- # used by seo meta and the atom feed
  记录技术折腾、踩坑笔记和一些想法。Tech notes and random stuff.
url: "https://zhangmq.github.io"

github:
  username: zhangmq

social:
  name: zhangmq # displayed as default author and copyright owner in Footer
  links:
    # The first element serves as the copyright owner's link
    - https://github.com/zhangmq

# Prefer color scheme setting.
# Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
# Available options: light | dark
theme_mode: # [light | dark]

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/avatar.svg

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
# It can be overridden by a customized `page.image` in front matter.
social_preview_image: /assets/img/og-image.png

# author for JSON-LD structured data (jekyll-seo-tag)
author: zhangmq

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  # Global switch for the post-comment system. Keeping it empty means disabled.
  provider: # [disqus | utterances | giscus]

pwa:
  enabled: true # The option for PWA feature (installable)

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

# 显式声明主题依赖的插件（与主题 gemspec 一致，确保 Actions 构建加载）
plugins:
  - jekyll-archives
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Web Analytics (GoatCounter, https://zhangmq.goatcounter.com)
analytics:
  goatcounter:
    id: "zhangmq"
